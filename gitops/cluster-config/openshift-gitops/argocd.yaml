apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  applicationSet:
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
  controller:
    processors: {}
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi
    sharding: {}
  dex:
    openShiftOAuth: true
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  grafana:
    enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
    route:
      enabled: false
  ha:
    enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  initialSSHKnownHosts: {}
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  rbac:
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
    scopes: '[groups]'
  redis:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  repo:
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
  resourceExclusions: |
    - apiGroups:
      - tekton.dev
      clusters:
      - '*'
      kinds:
      - TaskRun
      - PipelineRun
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi
    route:
      enabled: true
    service:
      type: ""
  tls:
    ca: {}
  resourceCustomizations: |
    argoproj.io/Application:
      health.lua: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil then
          if obj.status.health ~= nil then
            hs.status = obj.status.health.status
            if obj.status.health.message ~= nil then
              hs.message = obj.status.health.message
            end
          end
        end
        return hs
    ocs.openshift.io/StorageCluster:
      health.lua: |
        hs = {}
        if obj.status ~= nil and obj.status.phase ~= nil then
          if obj.status.phase == "Ready" then
            hs.status = "Healthy"
            hs.message = "StorageCluster is ready"
          else
            hs.status = "Progressing"
            hs.message = "StorageCluster phase: " .. obj.status.phase
          end
        else
          hs.status = "Progressing"
          hs.message = "Waiting for StorageCluster status"
        end
        return hs
    hco.kubevirt.io/HyperConverged:
      health.lua: |
        hs = {}
        if obj.status ~= nil and obj.status.conditions ~= nil then
          for _, c in pairs(obj.status.conditions) do
            if c.type == "Available" and c.status == "True" then
              hs.status = "Healthy"
              hs.message = "HyperConverged is available"
              return hs
            end
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for HyperConverged Available condition"
        return hs
    local.storage.openshift.io/LocalVolumeSet:
      health.lua: |
        hs = {}
        if obj.status ~= nil and obj.status.totalProvisionedDeviceCount ~= nil then
          if obj.status.totalProvisionedDeviceCount > 0 then
            hs.status = "Healthy"
            hs.message = "Provisioned " .. obj.status.totalProvisionedDeviceCount .. " device(s)"
            return hs
          end
        end
        hs.status = "Progressing"
        hs.message = "Waiting for local volumes to be provisioned"
        return hs
  kustomizeBuildOptions: '--enable-helm'
