---
# OpenShift Lightspeed 2.0 — OCP 5.0 only (channel: stable, redhat-operators)
# No GPU required — inference is offloaded to external provider endpoint
# Provider secret must be created out-of-band before applying the instance:
#   oc create secret generic llm-credentials -n openshift-lightspeed --from-literal=apitoken=<key>
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-lightspeed-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    namespace: openshift-lightspeed
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/cluster-config/openshift-lightspeed-operator/operator/overlays/stable
    repoURL: https://github.com/tosin2013/agent-gitops-quickstarts.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 5m0s
        factor: 2
